<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b21">
  <title>Story Walk</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./js/scenario.js"></script>
  <script defer src="./js/scene.js"></script>
  <script defer src="./js/save.js"></script>
  <script defer src="./js/game.js"></script>
</head>
<body>
  <main id="game" aria-label="アドベンチャーゲーム">
    <canvas id="scene" width="720" height="1280" aria-hidden="true"></canvas>
    <section id="title" class="title">
      <div class="title-content">
        <p class="eyebrow" lang="en">STORY WALK <span>02</span></p>
        <h1 id="work-title">Story Walk</h1>
        <p id="subtitle" class="subtitle"></p>
        <div class="title-actions">
          <button id="start" class="primary" disabled>はじめから</button>
          <button id="continue" disabled>つづきから</button>
        </div>
        <a class="back" href="../">← 戻る</a>
        <p id="status" class="status" role="status">物語を読み込み中…</p>
      </div>
    </section>
    <div id="chapter" class="chapter" hidden></div>
    <div id="part-id" class="part-id" hidden></div>
    <button id="home" class="home" aria-label="タイトルへ" hidden>タイトル</button>
    <section id="message" class="message" aria-live="polite" hidden>
      <p id="speaker" class="speaker"></p>
      <p id="line" class="line" tabindex="0"></p>
      <button id="advance" class="advance" aria-label="次へ">▾</button>
    </section>
    <div id="choices" class="choices" role="group" aria-label="物語の選択肢" hidden>
      <button class="choice" disabled><span class="choice-number">01</span><span class="choice-text"></span></button>
      <button class="choice" disabled><span class="choice-number">02</span><span class="choice-text"></span></button>
    </div>
    <section id="notice" class="notice" aria-labelledby="notice-text" role="alertdialog" aria-modal="true" hidden>
      <div>
        <p class="eyebrow" lang="en">STORY WALK</p>
        <p id="notice-text"></p>
        <div class="notice-actions">
          <button id="notice-close" class="primary"></button>
          <button id="notice-title" hidden>タイトルへ</button>
        </div>
      </div>
    </section>
  </main>
  <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
</body>
</html>
